<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laser Engraver Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h1>Laser Engraver</h1>
        <button id="homeBtn">Home Axes</button>
        <label class="power-wrap">
          <span>Laser power</span>
          <input id="powerSlider" type="range" min="0" max="100" value="25" />
          <strong id="powerValue">25%</strong>
        </label>
        <form id="uploadForm">
          <input id="svgUpload" type="file" accept=".svg" />
          <button type="submit">Upload SVG</button>
        </form>
      </aside>

      <main class="main-panel">
        <div class="status-row">
          <div class="tag" id="statusTag">OFFLINE</div>
          <div class="tag secondary" id="transportTag">tcp</div>
        </div>

        <div class="preview-card">
          <img id="previewImage" alt="Generated preview" />
        </div>

        <div class="code-card">
          <h2>G-code preview</h2>
          <pre id="gcodeOutput">No job yet.</pre>
        </div>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
